name: Validate pull requests

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: fieldops_ci
          POSTGRES_PASSWORD: fieldops_ci_only
          POSTGRES_DB: fieldops_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fieldops_ci -d fieldops_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql://fieldops_ci:fieldops_ci_only@localhost:5432/fieldops_test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install backend dependencies
        run: npm --prefix server ci

      - name: Lint
        run: npm run lint

      - name: Type check and build
        run: npm run build

      - name: Frontend synchronization tests
        run: npm test

      - name: Backend type check and build
        run: npm run server:build

      - name: Backend PostgreSQL integration tests
        run: npm run server:test
