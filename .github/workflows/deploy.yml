name: Deploy FieldOps to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: |
          npm run build
          node scripts/write-build-info.mjs "$GITHUB_SHA"

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload production build
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4


  smoke:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout deployed commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install pinned Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify deployed PWA and exact version
        run: npm run test:live
        env:
          SMOKE_SITE_URL: ${{ needs.deploy.outputs.page_url }}
          SMOKE_EXPECTED_SHA: ${{ github.sha }}
      - name: Upload synthetic live evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployed-pwa-smoke
          path: smoke-results/
          retention-days: 7
          if-no-files-found: warn
