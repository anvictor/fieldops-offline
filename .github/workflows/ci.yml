name: Validate pull requests

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: fieldops_ci
          POSTGRES_PASSWORD: fieldops_ci_only
          POSTGRES_DB: fieldops_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fieldops_ci -d fieldops_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql://fieldops_ci:fieldops_ci_only@localhost:5432/fieldops_test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install backend dependencies
        run: npm --prefix server ci

      - name: Lint
        run: npm run lint

      - name: Type check and build
        run: npm run build

      - name: Frontend synchronization tests
        run: npm test

      - name: Backend type check and build
        run: npm run server:build

      - name: Backend PostgreSQL integration tests
        run: npm run server:test


      - name: Install pinned Chromium
        run: npx playwright install --with-deps chromium

      - name: Production preview browser smoke
        shell: bash
        run: |
          node scripts/write-build-info.mjs "$GITHUB_SHA"
          npm run preview -- --host 127.0.0.1 --port 4173 --strictPort > /tmp/fieldops-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          SMOKE_SITE_URL=http://127.0.0.1:4173/fieldops-offline/ SMOKE_EXPECTED_SHA="$GITHUB_SHA" npm run test:live

      - name: Upload synthetic preview evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preview-pwa-smoke
          path: smoke-results/
          retention-days: 7
          if-no-files-found: warn

      - name: Build authenticated browser fixture
        run: npm run build
        env:
          VITE_API_BASE_URL: https://api.fieldops.test

      - name: Authenticated browser to disposable PostgreSQL
        run: node scripts/auth-browser-smoke.mjs

      - name: Upload secret-free auth browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auth-browser-smoke
          path: |
            smoke-results/auth-browser-report.json
            smoke-results/owner-connection.png
          retention-days: 7
          if-no-files-found: warn
